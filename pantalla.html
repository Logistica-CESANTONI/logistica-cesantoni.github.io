<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pantalla del almacén | Somos Logística CESANTONI</title>
  <meta name="description" content="Tablero de estatus de embarques para el almacén.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0D1114">
  <link rel="icon" type="image/png" sizes="32x32" href="img/icono-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Montserrat:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script>/* Si hay una versión nueva publicada, recarga una vez (la pantalla se queda abierta todo el día). */
    (function () { var V = '18'; setInterval(chk, 600000); chk(); function chk() { try { fetch('version.txt?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (t) {
      t = String(t || '').trim(); if (!t || t === V || sessionStorage.getItem('recarga-' + t)) return;
      sessionStorage.setItem('recarga-' + t, '1'); var u = new URL(location.href); u.searchParams.set('_v', t); location.replace(u.href); }).catch(function () {}); } catch (e) {} } })();</script>
  <link rel="stylesheet" href="css/pantalla.css?v=18">
</head>
<body>
  <header class="cab">
    <div class="marca"><span class="punto"></span> SOMOS LOGÍSTICA · CESANTONI</div>
    <h1>EMBARQUES</h1>
    <div class="der"><div id="reloj" class="reloj">--:--:--</div><div id="estado" class="estado">Cargando…</div></div>
  </header>
  <table class="tablero">
    <thead><tr><th class="sem"></th><th>Folio</th><th>Envío</th><th>Cliente · Destino</th><th>Transportista</th><th>Unidad</th><th>Cita</th><th>Andén</th><th>Docs</th><th>Estatus</th></tr></thead>
    <tbody id="filas"></tbody>
  </table>
  <footer class="pie">
    <span><i class="luz azul"></i> Recibido / En preparación</span>
    <span><i class="luz amarillo"></i> Armado</span>
    <span><i class="luz verde"></i> Listo / En ruta</span>
    <span><i class="luz rojo"></i> Parado / Incompleto</span>
    <span id="pagina" class="pagina"></span>
  </footer>
  <script src="js/config.js?v=18"></script>
  <script type="module" src="js/pantalla.js?v=18"></script>
</body>
</html>
